[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hey-claude-features"
version = "0.1.0"
description = "Feature modules for Hey-Claude assistant"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
